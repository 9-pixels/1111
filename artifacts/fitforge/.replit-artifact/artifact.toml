kind = "mobile"
previewPath = "/"
title = "FitForge"
description = "A native offline-first fitness app for building personalized workouts, logging training and nutrition, tracking progress, and following safe exercise guidance."
version = "1.0.0"
id = "artifacts/fitforge"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 26203

[services.development]
run = "pnpm --filter @workspace/fitforge run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/fitforge", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/fitforge", "run", "serve" ]

[services.env]
PORT = "26203"
BASE_PATH = "/"
